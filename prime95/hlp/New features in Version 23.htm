 <li class=MsoNormal style='mso-list:l11 level1 lfo3;tab-stops:list .5in'>Big
     SSE2 FFTs now take the L2 cache size into account.<span
     style="mso-spacerun: yes">  </span>P4 Celeron (128KB L2 cache) is faster
     for FFTs between 512K and 2M.<span style="mso-spacerun: yes">  </span>P4
