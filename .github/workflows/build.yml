# Build gwnum and prime95 on every push and pull request.
#
# Linux:   everything, then a quick PRP test of a known Mersenne prime.
# Windows: gwnum (32- and 64-bit), the factoring objects, and prime95.exe in
#          all four configurations.
#
# UASM comes from the prebuilt v2.58-gw1 release of
# https://github.com/gwoltman/UASM-2.58-gw1, objconv from agner.org, the
# Windows builds of GMP (libgmp-gw1) and cURL 8.5.0 from the v1 release of
# https://github.com/gwoltman/prime95-windows-deps, and hwloc and Boost from
# their own sites.  Every download is checked against a known SHA-256 hash.
# agner.org only serves the latest objconv; if its hash changes, check the new
# version produces the same objects (see BUILDING.md) before updating
# OBJCONV_SHA256.

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UASM_URL: https://github.com/gwoltman/UASM-2.58-gw1/releases/download/v2.58-gw1
  UASM_LINUX_SHA256: 7790bb12c86027b9b3f79f86a3300a41d90342393b9c2c13f9b0dc5fcee69e16
  UASM_WINDOWS_SHA256: 6a7a13a39b7d78296f525f94619d52e6044877c74c25890ed35e548bd50ceda6
  OBJCONV_URL: https://www.agner.org/optimize/objconv.zip
  OBJCONV_SHA256: 0f604f93f97f689afd7615c86176eb15bc95001eadf8317f17ebd099c50c59e1
  DEPS_URL: https://github.com/gwoltman/prime95-windows-deps/releases/download/v1
  GMP64_SHA256: a3c7d199c6904f0936a127c1654820caedce69e21cc8a7c0e23bb2ddc1e58c91
  GMP32_SHA256: ea3257ac92cbfb19e9120f95f934c6f88f81351b539dd873c26acd6826fd286f
  CURL64_SHA256: 04d932a888233b1d9eade87cfe657baec2708fd2887eca518f92a5e54013bb01
  CURL32_SHA256: 32256da3e0dffce6454a7879e678be54c29da3e661d7a562be3bb8ac401d4c24
  HWLOC_URL: https://download.open-mpi.org/release/hwloc/v2.8
  HWLOC64_SHA256: baf509622b63de8237c8f39ca70217bc568c5e79f1746bde3174d8ed886311f5
  HWLOC32_SHA256: ffbda20426c0b74188f6cf5098c75f3c532d4b537e60206212d00d3f75c7435c
  BOOST_URL: https://archives.boost.io/release/1.76.0/source/boost_1_76_0.tar.bz2
  BOOST_SHA256: f0397ba6e982c4450f27bf32a2a83292aba035b827a5623a14636ea583318c41

jobs:
  linux64:
    name: Linux 64-bit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libhwloc-dev libcurl4-openssl-dev libboost-dev

      - name: Get UASM and objconv
        run: |
          mkdir -p ~/tools && cd ~/tools
          curl -fsSL -o uasm.tar.gz "$UASM_URL/uasm-2.58-gw1-linux-x86_64.tar.gz"
          echo "$UASM_LINUX_SHA256  uasm.tar.gz" | sha256sum -c
          tar xzf uasm.tar.gz
          cp uasm-2.58-gw1-linux-x86_64/uasm .
          curl -fsSL -o objconv.zip "$OBJCONV_URL"
          echo "$OBJCONV_SHA256  objconv.zip" | sha256sum -c
          unzip -q objconv.zip source.zip
          mkdir objconv-src && cd objconv-src && unzip -q ../source.zip
          g++ -O2 -o ../objconv *.cpp

      - name: Assemble gwnum
        run: make -C gwnum -f makeasm64 -j4 UASM=$HOME/tools/uasm OBJCONV=$HOME/tools/objconv

      - name: Build gwnum
        run: make -C gwnum -f make64 -j4

      - name: Assemble factor64
        run: make -C prime95 -f makeasm64 UASM=$HOME/tools/uasm OBJCONV=$HOME/tools/objconv

      # Official builds link hwloc and curl statically (see linux/make64);
      # Ubuntu's static libraries need more dependencies, so link them
      # dynamically here, and skip the link map.
      - name: Build mprime
        run: >
          make -C linux -f make64 -j4 BOOST=/usr/include
          LFLAGS="-Wl,-L/usr/local/lib"
          LIBS="../gwnum/gwnum.a ../gwnum/polymult.a -lm -lpthread -lhwloc -lcurl -lstdc++ -ldl -lgmp"

      - name: PRP test of M86243 (a known Mersenne prime)
        run: |
          mkdir test && cd test
          printf 'UsePrimenet=0\nStressTester=0\nV5UserID=ANONYMOUS\nComputerID=ci\n' > prime.txt
          echo 'PRP=1,2,86243,-1' > worktodo.txt
          ../linux/mprime -d -w"$PWD" > mprime.log 2>&1 &
          pid=$!
          for i in $(seq 1 60); do
            grep -q '"exponent":86243' results.json.txt 2>/dev/null && break
            sleep 10
          done
          kill $pid || true
          cat mprime.log
          cat results.json.txt
          grep -q '"status":"P", "exponent":86243' results.json.txt

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Get UASM and objconv
        shell: pwsh
        run: |
          Invoke-WebRequest "$env:UASM_URL/uasm-2.58-gw1-windows-x64.zip" -OutFile uasm.zip
          if ((Get-FileHash uasm.zip -Algorithm SHA256).Hash -ne $env:UASM_WINDOWS_SHA256) { throw "uasm.zip checksum mismatch" }
          Expand-Archive uasm.zip -DestinationPath uasm-tmp
          New-Item -ItemType Directory -Force c:\uasm_258gw1 | Out-Null
          Copy-Item uasm-tmp\uasm-2.58-gw1-windows-x64\uasm64.exe c:\uasm_258gw1\
          Invoke-WebRequest $env:OBJCONV_URL -OutFile objconv.zip
          if ((Get-FileHash objconv.zip -Algorithm SHA256).Hash -ne $env:OBJCONV_SHA256) { throw "objconv.zip checksum mismatch" }
          Expand-Archive objconv.zip -DestinationPath c:\objconv
          Remove-Item -Recurse uasm-tmp, uasm.zip, objconv.zip

      # Only Boost's headers are used; unpacking them takes a while, so keep
      # them between runs
      - name: Cache Boost headers
        uses: actions/cache@v6
        with:
          path: C:\deps\boost_1_76_0
          key: boost-1.76.0-headers

      - name: Get GMP, cURL, hwloc and Boost
        shell: pwsh
        run: |
          function Get-Checked($url, $file, $sha) {
            Invoke-WebRequest $url -OutFile $file
            if ((Get-FileHash $file -Algorithm SHA256).Hash -ne $sha) { throw "$file checksum mismatch" }
          }
          New-Item -ItemType Directory -Force C:\deps | Out-Null
          Set-Location C:\deps
          Get-Checked "$env:DEPS_URL/libgmp-gw1-6.2.0-win64.zip" gmp64.zip $env:GMP64_SHA256
          Get-Checked "$env:DEPS_URL/libgmp-gw1-6.2.0-win32.zip" gmp32.zip $env:GMP32_SHA256
          Get-Checked "$env:DEPS_URL/curl-8.5.0-win64-mingw.zip" curl64.zip $env:CURL64_SHA256
          Get-Checked "$env:DEPS_URL/curl-8.5.0-win32-mingw.zip" curl32.zip $env:CURL32_SHA256
          Get-Checked "$env:HWLOC_URL/hwloc-win64-build-2.8.0.zip" hwloc64.zip $env:HWLOC64_SHA256
          Get-Checked "$env:HWLOC_URL/hwloc-win32-build-2.8.0.zip" hwloc32.zip $env:HWLOC32_SHA256
          foreach ($z in 'gmp64', 'gmp32', 'curl64', 'curl32', 'hwloc64', 'hwloc32') {
            Expand-Archive "$z.zip" -DestinationPath . ; Remove-Item "$z.zip"
          }
          if (-not (Test-Path boost_1_76_0\boost\version.hpp)) {
            Get-Checked $env:BOOST_URL boost.tar.bz2 $env:BOOST_SHA256
            tar -xjf boost.tar.bz2 boost_1_76_0/boost
            Remove-Item boost.tar.bz2
          }
          @("P95_GMP64_DIR=C:\deps\gmp64", "P95_GMP32_DIR=C:\deps\gmp32",
            "P95_CURL64_DIR=C:\deps\curl-8.5.0-win64-mingw", "P95_CURL32_DIR=C:\deps\curl-8.5.0-win32-mingw",
            "P95_HWLOC64_DIR=C:\deps\hwloc-win64-build-2.8.0", "P95_HWLOC32_DIR=C:\deps\hwloc-win32-build-2.8.0",
            "P95_BOOST_DIR=C:\deps\boost_1_76_0") | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build 64-bit gwnum
        shell: cmd
        run: |
          cd gwnum
          call c64.bat
          if errorlevel 1 exit /b 1

      - name: Build 32-bit gwnum
        shell: cmd
        run: |
          cd gwnum
          call c.bat
          if errorlevel 1 exit /b 1

      - name: Assemble factoring code
        shell: cmd
        run: |
          cd prime95
          call c64.bat
          if errorlevel 1 exit /b 1
          call c.bat
          if errorlevel 1 exit /b 1

      - name: Check outputs
        shell: pwsh
        run: |
          $files = 'gwnum\gwnum64.lib', 'gwnum\gwnum64d.lib', 'gwnum\polymult64.lib', 'gwnum\polymult64d.lib',
                   'gwnum\gwnum.lib', 'gwnum\gwnumd.lib', 'gwnum\polymult.lib', 'gwnum\polymultd.lib',
                   'gwnum\linux64\gwnum.a', 'gwnum\linux\gwnum.a',
                   'prime95\amd64\factor64.obj', 'prime95\factor32.obj'
          $missing = $files | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Missing: $missing" }
          Get-Item $files | Format-Table Name, Length

      # Without the private security files, this is the "Untrusted Prime95"
      # build; the project creates empty placeholders for them.
      - name: Build prime95.exe
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\amd64\MSBuild.exe' | Select-Object -First 1
          foreach ($cfg in 'Release|x64', 'Release|Win32', 'Debug|x64', 'Debug|Win32') {
            $c, $p = $cfg -split '\|'
            Write-Host "::group::$cfg"
            & $msbuild prime95\prime95.sln -nologo -v:minimal -m "-p:Configuration=$c" "-p:Platform=$p"
            $rc = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($rc -ne 0) { throw "prime95.sln $cfg failed" }
          }
          Get-Item prime95\x64\Release\prime95.exe, prime95\Release\prime95.exe,
                   prime95\x64\Debug\prime95.exe, prime95\Debug\prime95.exe | Format-Table FullName, Length
